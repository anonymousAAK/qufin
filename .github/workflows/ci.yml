name: CI
on: [push, pull_request]

# Least-privilege default for every job. Jobs that need more (e.g. release)
# elevate their own permissions explicitly.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -c "import qufin; print('qufin imported OK')"
      - run: pytest -m "not hardware and not slow" --cov=qufin --cov-report=xml --cov-fail-under=90 --tb=short
      - uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          file: coverage.xml
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check src/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: |
          mypy src/qufin/backtesting/ \
               src/qufin/risk/classical_var.py \
               src/qufin/risk/stress.py \
               src/qufin/risk/counterparty.py \
               src/qufin/portfolio/classical/

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install bandit pip-audit
      - name: Bandit static analysis
        run: bandit -r src/qufin/ -ll -q
      - name: Audit dependencies (pip-audit against the pinned set)
        # Non-blocking for now, but surfaces a clear summary so a vulnerable
        # dependency is visible in the job log and step summary.
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pip install -e . -c constraints.txt
          echo "## pip-audit results" >> "$GITHUB_STEP_SUMMARY"
          # pipefail makes the if-test reflect pip-audit's exit status, not tee's.
          if pip-audit --strict --desc on | tee /tmp/pip-audit.txt; then
            echo "pip-audit: no known vulnerabilities in the resolved dependency tree."
            echo "No known vulnerabilities found." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::pip-audit reported known vulnerabilities (see job log)."
            { echo '```'; cat /tmp/pip-audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

  examples:
    # Run the advertised quickstart end-to-end so it can never silently rot.
    # (examples/quickstart.py is provided by the docs/examples workstream.)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Run quickstart example
        run: python examples/quickstart.py

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]" mkdocs mkdocs-material "mkdocstrings[python]"
      - run: mkdocs build --strict

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, lint, typecheck, security]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/qufin
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
