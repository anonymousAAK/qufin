apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    app.kubernetes.io/name: qufin
    app.kubernetes.io/component: worker
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: qufin
      app.kubernetes.io/component: worker
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qufin
        app.kubernetes.io/component: worker
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "qufin.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command:
            - celery
            - -A
            - qufin.api.jobs
            - worker
            - --loglevel=info
            - --concurrency={{ .Values.worker.concurrency }}
            - --max-tasks-per-child={{ .Values.worker.maxTasksPerChild }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
          env:
            {{- include "qufin.secretEnv" . | nindent 12 }}
            {{- include "qufin.redisEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          livenessProbe:
            # Restart the worker if it can no longer reach the broker / answer ping.
            # $$(hostname) escapes Helm; the shell (not k8s) resolves the hostname.
            exec:
              command:
                - sh
                - -c
                - celery -A qufin.api.jobs inspect ping -d "celery@$$(hostname)" --timeout 10
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 15
          volumeMounts:
            # Writable scratch required because readOnlyRootFilesystem is true.
            - name: tmp
              mountPath: /tmp
            {{- if .Values.persistence.enabled }}
            - name: data-warehouse
              mountPath: /app/data
            {{- end }}
      terminationGracePeriodSeconds: 60
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.persistence.enabled }}
        - name: data-warehouse
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
        {{- end }}
---
{{- if .Values.worker.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    app.kubernetes.io/name: qufin
    app.kubernetes.io/component: worker
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-worker
  minReplicas: {{ .Values.worker.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.worker.autoscaling.maxReplicas }}
  metrics:
    # CPU-based scaling as a baseline
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # Queue-depth scaling (requires KEDA or custom metrics adapter)
    # When using KEDA, replace this block with a ScaledObject resource
    # pointing to the Redis list length for the Celery queue.
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
{{- end }}
