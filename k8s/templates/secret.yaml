{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    app.kubernetes.io/name: qufin
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  # API keys for the REST API (comma-separated). Consumed by the API container
  # as QUFIN_API_KEYS; the API refuses to start without it unless allowNoAuth.
  {{- if .Values.secrets.apiKeys }}
  QUFIN_API_KEYS: {{ .Values.secrets.apiKeys | quote }}
  {{- end }}
  # Redis AUTH password used in broker/result URLs and Redis --requirepass.
  {{- if .Values.secrets.redisPassword }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
  {{- end }}
  # Data-provider / quantum-hardware credentials (moved out of the ConfigMap).
  {{- if .Values.secrets.fredApiKey }}
  QUFIN_FRED_API_KEY: {{ .Values.secrets.fredApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.ibmQuantumToken }}
  IBM_QUANTUM_TOKEN: {{ .Values.secrets.ibmQuantumToken | quote }}
  {{- end }}
{{- end }}
