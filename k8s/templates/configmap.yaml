apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    app.kubernetes.io/name: qufin
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  QUFIN_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  QUFIN_DEFAULT_BACKEND: {{ .Values.config.defaultBackend | quote }}
  QUFIN_DEFAULT_SHOTS: {{ .Values.config.defaultShots | quote }}
  QUFIN_CACHE_BACKEND: {{ .Values.config.cacheBackend | quote }}
  # Redis host/port only — the password is injected from the Secret at the pod
  # level and the credentialed URLs are assembled there via $(REDIS_PASSWORD).
  # Secrets are NEVER stored in this ConfigMap.
  {{- if .Values.redis.enabled }}
  REDIS_HOST: "{{ .Release.Name }}-redis"
  {{- else }}
  REDIS_HOST: {{ .Values.redis.host | quote }}
  {{- end }}
  REDIS_PORT: {{ .Values.redis.port | quote }}
