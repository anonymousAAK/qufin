apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app.kubernetes.io/name: qufin
    app.kubernetes.io/component: api
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: qufin
      app.kubernetes.io/component: api
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qufin
        app.kubernetes.io/component: api
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: {{ include "qufin.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - containerPort: {{ .Values.api.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
          env:
            # Auth (fail-closed): the API refuses to start without QUFIN_API_KEYS
            # unless allowNoAuth is true.
            - name: QUFIN_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ include "qufin.secretName" . }}
                  key: QUFIN_API_KEYS
                  optional: true
            - name: QUFIN_ALLOW_NO_AUTH
              value: {{ if .Values.allowNoAuth }}"1"{{ else }}"0"{{ end }}
            {{- include "qufin.secretEnv" . | nindent 12 }}
            {{- include "qufin.redisEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: {{ .Values.api.readinessPath | default "/health" }}
              port: {{ .Values.api.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            # Writable scratch required because readOnlyRootFilesystem is true.
            - name: tmp
              mountPath: /tmp
            {{- if .Values.persistence.enabled }}
            - name: data-warehouse
              mountPath: /app/data
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.persistence.enabled }}
        - name: data-warehouse
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
        {{- end }}
---
{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  labels:
    app.kubernetes.io/name: qufin
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
