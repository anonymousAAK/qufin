[build-system]
requires = ["hatchling>=1.26", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "qufin"
dynamic = ["version"]
description = "Research-grade quantum algorithms for production-grade quant finance."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Adarsh Keshri" }]
maintainers = [{ name = "anonymousAAK" }]
keywords = [
  "quantum",
  "finance",
  "qaoa",
  "amplitude-estimation",
  "portfolio-optimization",
  "option-pricing",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Office/Business :: Financial :: Investment",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy>=1.26,<3.0",
  "scipy>=1.11",
  "pandas>=2.1",
  "pyarrow>=15.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "qiskit>=1.0,<3.0",
  "qiskit-aer>=0.14",
  "cvxpy>=1.4",
  "scikit-learn>=1.4",
  "statsmodels>=0.14",
  "arch>=6.3",
  "yfinance>=0.2.40",
  "fredapi>=0.5",
  "networkx>=3.2",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
ibm = ["qiskit-ibm-runtime>=0.20"]
pennylane = ["pennylane>=0.36", "pennylane-lightning>=0.36"]
cirq = ["cirq-core>=1.3"]
braket = ["amazon-braket-sdk>=1.80"]
ml = ["torch>=2.2"]
viz = ["plotly>=5.20"]
dwave = ["dwave-ocean-sdk>=6.0"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "celery[redis]>=5.3", "redis>=5.0"]
docs = ["sphinx>=7", "sphinx-book-theme", "myst-nb", "sphinx-copybutton"]
dev = [
  "pytest>=8",
  "pytest-cov",
  "pytest-benchmark",
  "hypothesis>=6.99",
  "ruff",
  "black",
  "mypy>=1.10",
  "pre-commit",
  "nbstripout",
]
all = ["qufin[ibm,pennylane,cirq,braket,dwave,ml,viz]"]

[project.scripts]
qufin = "qufin.cli:main"

[project.urls]
Homepage = "https://github.com/anonymousAAK/qufin"
Documentation = "https://anonymousAAK.github.io/qufin"
Issues = "https://github.com/anonymousAAK/qufin/issues"
Changelog = "https://github.com/anonymousAAK/qufin/blob/master/CHANGELOG.md"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/qufin/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/qufin"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PL", "RUF"]
ignore = [
  "PLR0913",   # too many arguments (finance functions naturally have many params)
  "PLC0415",   # import not at top level (intentional lazy imports for optional deps)
  "N803",      # argument name should be lowercase (math convention: T, K, Q, P)
  "N806",      # variable should be lowercase (math convention: S, Q, P, T)
  "PLR2004",   # magic value comparison (numeric thresholds like 1e-12)
  "PLR0912",   # too many branches
  "PLR0915",   # too many statements
  "PLR0911",   # too many return statements (barrier pricing has many cases)
  "SIM108",    # use ternary (less readable for complex expressions)
  "RUF012",    # mutable class default (class-level dicts are intentional constants)
  "PLW0603",   # global statement (singleton settings pattern)
  "E741",      # ambiguous variable name (l used in Dicke state loop)
  "B023",      # function doesn't bind loop var (closure in QGAN training)
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "qufin.backtesting.*",
  "qufin.benchmarks.*",
  "qufin.portfolio.classical.*",
  "qufin.risk.classical_var",
  "qufin.risk.cvar",
  "qufin.risk.stress",
  "qufin.risk.counterparty",
]
disallow_untyped_defs = true

[tool.pytest.ini_options]
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
markers = [
  "slow: tests that take >5s",
  "hardware: tests that require real quantum hardware credentials",
  "regression: paper-reproduction regression tests",
]

[tool.coverage.run]
source = ["qufin"]
omit = [
  "src/qufin/_version.py",
  "src/qufin/backends/ibm_runtime.py",
  "src/qufin/backends/pennylane_backend.py",
  "src/qufin/backends/cirq_backend.py",
  "src/qufin/backends/braket_backend.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.",
]
