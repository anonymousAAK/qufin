[build-system]
requires = ["hatchling>=1.26", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "qufin"
dynamic = ["version"]
description = "Research-grade quantum algorithms for production-grade quant finance."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Adarsh Keshri" }]
maintainers = [{ name = "Adarsh Keshri" }]
keywords = [
  "quantum",
  "finance",
  "qaoa",
  "amplitude-estimation",
  "portfolio-optimization",
  "option-pricing",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Office/Business :: Financial :: Investment",
  "Operating System :: OS Independent",
]
# Dependency supply chain: every runtime dep carries a tested lower bound AND a
# conservative upper bound (next major for >=1.0 projects, next minor for 0.x).
# The lower bound is the oldest version the API targets; the upper bound is one
# major (or minor for 0.x) above the version this repo is actively tested on so a
# breaking transitive release cannot be pulled silently. Known-good versions used
# for testing are pinned in constraints.txt (see [pip] install --require-hashes is
# NOT used here because no hashes are generated offline; constraints.txt documents
# the reproducible set). Tested env (Python 3.11): numpy 2.4.6, scipy 1.17.1,
# pandas 3.0.3, pyarrow 24.0.0, pydantic 2.13.4, pydantic-settings 2.14.1,
# qiskit 2.4.1, qiskit-aer 0.17.2, cvxpy 1.9.1, scikit-learn 1.9.0,
# statsmodels 0.14.6, arch 8.0.0, yfinance 1.4.1, fredapi 0.5.2, networkx 3.6.1,
# matplotlib 3.10.9.
dependencies = [
  "numpy>=1.26,<3.0",
  "scipy>=1.11,<2.0",
  "pandas>=2.1,<4.0",
  "pyarrow>=15.0,<26.0",
  "pydantic>=2.6,<3.0",
  "pydantic-settings>=2.2,<3.0",
  # qiskit 1.x -> 2.x is a breaking MAJOR; this repo is tested on qiskit 2.x only.
  "qiskit>=2.0,<3.0",
  "qiskit-aer>=0.14,<0.18",
  "cvxpy>=1.4,<2.0",
  "scikit-learn>=1.4,<2.0",
  "statsmodels>=0.14,<0.16",
  "arch>=6.3,<9.0",
  "yfinance>=0.2.40,<2.0",
  "fredapi>=0.5,<0.6",
  "networkx>=3.2,<4.0",
  "matplotlib>=3.8,<4.0",
]

[project.optional-dependencies]
ibm = ["qiskit-ibm-runtime>=0.20"]
pennylane = ["pennylane>=0.36", "pennylane-lightning>=0.36"]
cirq = ["cirq-core>=1.3"]
braket = ["amazon-braket-sdk>=1.80"]
ml = ["torch>=2.2"]
viz = ["plotly>=5.20"]
dwave = ["dwave-ocean-sdk>=6.0"]
ionq = ["amazon-braket-sdk>=1.80"]
quantinuum = ["pytket>=1.25", "pytket-quantinuum>=0.30"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "celery[redis]>=5.3", "redis>=5.0"]
docs = ["mkdocs>=1.5", "mkdocs-material>=9", "mkdocstrings[python]>=0.24", "pymdown-extensions>=10"]
dev = [
  "pytest>=8",
  "pytest-cov",
  "pytest-asyncio>=0.23",
  "pytest-benchmark",
  "hypothesis>=6.99",
  "ruff",
  "mypy>=1.10",
  "pre-commit",
  "nbstripout",
]
all = ["qufin[ibm,pennylane,cirq,braket,dwave,ionq,quantinuum,ml,viz]"]

[project.scripts]
qufin = "qufin.cli:main"

[project.urls]
Homepage = "https://github.com/anonymousAAK/qufin"
Documentation = "https://anonymousAAK.github.io/qufin"
Issues = "https://github.com/anonymousAAK/qufin/issues"
Changelog = "https://github.com/anonymousAAK/qufin/blob/master/CHANGELOG.md"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/qufin/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/qufin"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PL", "RUF"]
ignore = [
  "PLR0913",   # too many arguments (finance functions naturally have many params)
  "PLC0415",   # import not at top level (intentional lazy imports for optional deps)
  "N803",      # argument name should be lowercase (math convention: T, K, Q, P)
  "N806",      # variable should be lowercase (math convention: S, Q, P, T)
  "PLR2004",   # magic value comparison (numeric thresholds like 1e-12)
  "PLR0912",   # too many branches
  "PLR0915",   # too many statements
  "PLR0911",   # too many return statements (barrier pricing has many cases)
  "SIM108",    # use ternary (less readable for complex expressions)
  "RUF012",    # mutable class default (class-level dicts are intentional constants)
  "PLW0603",   # global statement (singleton settings pattern)
  "E741",      # ambiguous variable name (l used in Dicke state loop)
  "B023",      # function doesn't bind loop var (closure in QGAN training)
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "qufin.backtesting.*",
  "qufin.benchmarks.*",
  "qufin.portfolio.classical.*",
  "qufin.risk.classical_var",
  "qufin.risk.cvar",
  "qufin.risk.stress",
  "qufin.risk.counterparty",
]
disallow_untyped_defs = true

[tool.pytest.ini_options]
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
markers = [
  "slow: tests that take >5s",
  "hardware: tests that require real quantum hardware credentials",
  "regression: paper-reproduction regression tests",
  "asyncio: async tests requiring pytest-asyncio",
]

[tool.coverage.run]
source = ["qufin"]
omit = [
  "*/_version.py",
  "*/backends/ibm_runtime.py",
  "*/backends/pennylane_backend.py",
  "*/backends/cirq_backend.py",
  "*/backends/braket_backend.py",
  "*/backends/cudaq_backend.py",
  "*/backends/dwave_backend.py",
  "*/backends/ionq_backend.py",
  "*/backends/quantinuum_backend.py",
  "*/data/bloomberg.py",
  "*/data/refinitiv.py",
  "*/api/server.py",
  "*/viz/dashboard.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.",
  "except ImportError",
  "pass$",
]
